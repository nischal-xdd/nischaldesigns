<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wholesale Price Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        font-family: Arial;
        background: #0f172a;
        color: white;
    }

    header {
        background: #1e293b;
        padding: 15px;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        color: #38bdf8;
    }

    .container {
        padding: 15px;
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 5px 0;
        border-radius: 8px;
        border: none;
        outline: none;
    }

    button {
        width: 100%;
        padding: 10px;
        background: #38bdf8;
        border: none;
        border-radius: 8px;
        margin-top: 10px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #0ea5e9;
    }

    .card {
        background: #1e293b;
        padding: 10px;
        margin-top: 10px;
        border-radius: 10px;
        border-left: 4px solid #38bdf8;
    }

    .price {
        color: #22c55e;
        font-weight: bold;
    }
</style>
</head>

<body>

<header>WHOLESALE PRICE TRACKER</header>

<div class="container">

    <h3>Add Product</h3>

    <input id="product" placeholder="Product name">
    <input id="price" type="number" placeholder="Wholesale price (Rs.)">
    <input id="seller" placeholder="Seller name">

    <button onclick="addProduct()">Add Price</button>

    <h3>Price List</h3>
    <div id="list"></div>

</div>

<script>
function addProduct() {
    let product = document.getElementById("product").value;
    let price = document.getElementById("price").value;
    let seller = document.getElementById("seller").value;

    if(!product || !price || !seller) {
        alert("Please fill all fields");
        return;
    }

    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
        📦 ${product} <br>
        💰 Price: <span class="price">Rs. ${price}</span><br>
        🏪 Seller: ${seller}
    `;

    document.getElementById("list").appendChild(div);

    document.getElementById("product").value = "";
    document.getElementById("price").value = "";
    document.getElementById("seller").value = "";
}
</script>

</body>
</html>
